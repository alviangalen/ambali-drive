
services:
  # 1. Aplikasi Web (Backend & Frontend)
  ambali-drive-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
    image: ambali-drive:latest
    restart: always
    ports:
      - "9000:9000" # Port ini yang diekspos (frontend & backend menyatu)
    environment:
      # Database — points to the 'db-ambali' service inside Docker network
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres_default_pw@db-ambali:5432/ambalidrive}
      # JWT — override in .env on server for security
      - JWT_SECRET=${JWT_SECRET:-rahasiasuperkuat123}
      # Firebase — override in .env on server with real values
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-dummy_project_id}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-dummy@dummy.iam.gserviceaccount.com}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-dummy_key}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-dummy_api_key}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-dummy.firebaseapp.com}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-dummy_project_id}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-dummy_app_id}
    volumes:
      - /mnt/storage/ambali-drive-storage:/app/storage 
    networks:
      - ambali_network
    depends_on:
      - db-ambali

  # 2. Database (PostgreSQL)
  db-ambali:
    image: postgres:15-alpine
    container_name: ambali-db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ambalidrive}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_default_pw}
    volumes:
      - ambali_db_data:/var/lib/postgresql/data 
    networks:
      - ambali_network

networks:
  ambali_network:

volumes:
  ambali_db_data:
